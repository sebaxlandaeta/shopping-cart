<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Mis Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Staatliches&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shopping-cart.css">
</head>
<body>
    <header class="header">
        <h1>Shopping Cart</h1>
        <p>¡Todos tus productos seleccionados están aquí!</p>
    </header>
    <main>
        <section class="compras">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Precio Unitario</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Tiempo de compra</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="total-container">
                <span id="showTotal">Total: $0.00</span>
            </div>
            <div class="container-button">
                <a href="../index.html">Volver a la tienda</a>
            </div>
        </section>
    </main>
    <script src="../js/shopping-card.js"></script>
</body>
</html>
